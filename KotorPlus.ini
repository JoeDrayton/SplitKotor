; KotorPlus settings. Delete this file to restore defaults. Most of these can be changed in game with F8.
[KotorPlus]
; Frame cap. 0 = uncapped.
FpsCap=240
; Optional lower frame cap during combat and CombatCapHoldMs after it. 0 = off (not needed with StuckFix)
CombatFpsCap=0
CombatCapHoldMs=5000
; Fix for 'can't move after combat'
StuckFix=1
; Walk/run toggle key (66 = B)
WalkKey=66
; Hold middle mouse: mouse turns the camera, you keep walking the way you were going
FreeLook=1
; Hold SkipKey (32 = Space) in a conversation to play it this many times faster (0 = off, 2-4)
DialogSpeed=3
SkipKey=32
; Don't switch the monitor's display mode at startup (no black screens)
NoModeSwitch=1
; Key for the in-game KotorPlus settings panel (119 = F8)
MenuKey=119
; On-screen combat readout (toggle in game with ReadoutKey)
CombatReadout=0
ReadoutLines=6
ReadoutSeconds=10
; 1 = only show attacks by or against you and your party
ReadoutPartyOnly=1
; Equip screen shows the item you already have in that slot
ItemCompare=1
; Borderless window (needs FullScreen=0 and AllowWindowedMode=1 in swkotor.ini)
Borderless=1
; Detects a wedged combat round (timer frozen 4s, game not paused) and ends it
AutoUnstick=1
; Virtual-key codes: 120=F9 121=F10 122=F11
DumpKey=120
UnstickKey=121
ReadoutKey=122
